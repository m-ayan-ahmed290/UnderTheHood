name: Core, web and desktop
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platforms.yml'
      - 'apps/web/**'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'services/companion/**'
      - 'scripts/prepare-desktop.py'
      - 'scripts/integration-test.py'
      - 'Cargo.*'
      - 'package*.json'
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: false
jobs:
  core-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - run: npm ci
      - run: npm run build:web
      - run: cargo test --locked --workspace --exclude underthehood-desktop
      - run: cargo fmt --all -- --check
      - run: python3 scripts/integration-test.py
      - uses: actions/upload-artifact@v4
        with:
          name: UnderTheHood-Web
          path: apps/web/dist/
  desktop:
    needs: core-web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build:web
      - run: python scripts/prepare-desktop.py
      - run: npm run build -w @hood/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: UnderTheHood-Desktop-${{ runner.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app.tar.gz
