name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile bundled Android Rclone
        run: bash scripts/build-rclone-android.sh arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Rclone
          path: apps/android/app/src/main/jniLibs/
      - name: Test and build native APK variants
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Package APKs
        run: |
          mkdir -p artifacts
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk artifacts/UnderTheHood-Android-debug.apk
          cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/UnderTheHood-Android-release-unsigned.apk
          cd artifacts
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: UnderTheHood-Android
          path: artifacts/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/schemas/
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile x86 Android engine
        run: bash scripts/build-rclone-android.sh x86_64
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-test-reports
          path: apps/android/app/build/reports/androidTests/
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [android, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UnderTheHood-Android
          path: artifacts
      - name: Publish downloadable APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "UnderTheHood $GITHUB_REF_NAME" --notes "Android ARM64 development build. Install the debug APK. The unsigned release APK requires signing. Provider sessions have not been live-tested."
          else
            if gh release view android-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload android-preview artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release create android-preview artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "UnderTheHood Android preview" --notes "Android ARM64 development build. Install UnderTheHood-Android-debug.apk. Development signing; not a production release. Provider sessions have not been live-tested."
            fi
          fi
