name: Android APK · build, test and release
on:
  push:
    branches: ['main', 'codex/android-native-20261018']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: native/rclone/go.sum
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test native engine with real local backends
        working-directory: native/rclone
        run: go test -mod=readonly -v ./...
      - name: Compile bundled Android libraries
        run: ./scripts/build-native.sh
      - name: Test, lint and assemble Android only
        run: ./gradlew --no-daemon :android:testDebugUnitTest :android:lintDebug :android:assembleDebug :android:assembleRelease :android:assembleDebugAndroidTest
      - name: Prepare downloadable APKs
        run: |
          mkdir -p dist
          cp apps/android/build/outputs/apk/debug/android-debug.apk dist/UnderTheHood-Android-debug.apk
          cp apps/android/build/outputs/apk/release/android-release-unsigned.apk dist/UnderTheHood-Android-release-unsigned.apk
          cp apps/android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk dist/UnderTheHood-Android-tests.apk
          python3 scripts/notices.py > dist/THIRD_PARTY_NOTICES.txt
          cd dist
          sha256sum *.apk THIRD_PARTY_NOTICES.txt > SHA256SUMS
      - name: Optionally sign production APK
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
            printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out dist/UnderTheHood-Android-release.apk dist/UnderTheHood-Android-release-unsigned.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/UnderTheHood-Android-release.apk
            (cd dist && sha256sum *.apk THIRD_PARTY_NOTICES.txt > SHA256SUMS)
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UnderTheHood-Android
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            apps/android/build/reports/
            apps/android/build/test-results/
  device-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: UnderTheHood-Android
          path: dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: ./scripts/device-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Android-device-test-results
          path: device-test-results.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, device-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: UnderTheHood-Android
          path: dist
      - name: Publish Android assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          rm dist/UnderTheHood-Android-tests.apk
          (cd dist && sha256sum *.apk THIRD_PARTY_NOTICES.txt > SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/* --title "UnderTheHood Android $RELEASE_TAG" --prerelease --notes "Native Android preview. Download UnderTheHood-Android-debug.apk for an installable development build. The unsigned release APK requires signing before installation. Debug signing is for development and may change between runs. Provider live logins require user authorization and are not certified by the automated local-backend tests. See README and docs/status.md for feature coverage and limitations."
