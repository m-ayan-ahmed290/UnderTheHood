name: Publish desktop and web previews
on:
  workflow_run:
    workflows: ['Core, web and desktop']
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: UnderTheHood-*
          path: packages
      - name: Package downloadable platform builds
        run: |
          mkdir -p assets
          cd packages
          for name in UnderTheHood-Web UnderTheHood-Desktop-Linux UnderTheHood-Desktop-Windows UnderTheHood-Desktop-macOS; do
            test -d "$name"
            zip -qr "../assets/$name.zip" "$name"
          done
          cd ../assets
          sha256sum *.zip > SHA256SUMS
      - name: Publish verified build outputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$BUILD_BRANCH" == main ]]; then
            tag=desktop-preview
          elif [[ "$BUILD_BRANCH" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            tag="$BUILD_BRANCH"
          else
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$BUILD_SHA" --prerelease --title "UnderTheHood $tag" --notes "Desktop and PWA development previews. Desktop bundles include native Rclone. Windows/macOS packages are unsigned or unnotarized. Web requires the local companion; Supabase deployment remains optional." || gh release view "$tag"
          fi
          gh release upload "$tag" assets/* --clobber
